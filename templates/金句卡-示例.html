<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#F0EEE6; }
</style>
</head>
<body>
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="780" fill="#F0EEE6"/>

  <!-- 顶部小标识 -->
  <circle cx="60" cy="58" r="7" fill="#DA7756"/>
  <text x="82" y="66" font-family="PingFang SC, -apple-system, sans-serif" font-size="22" fill="#7A776F" letter-spacing="1">COWORKER · 收尾</text>

  <!-- 主标题 行1 -->
  <text x="600" y="328" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="68" font-weight="600" letter-spacing="2">
    <tspan fill="#2A2825">从「</tspan><tspan fill="#A8A49B">我的</tspan><tspan fill="#2A2825">」AI</tspan>
  </text>

  <!-- 主标题 行2 -->
  <text x="600" y="420" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="68" font-weight="600" letter-spacing="2">
    <tspan fill="#2A2825">到「</tspan><tspan fill="#DA7756" font-weight="700">我们的</tspan><tspan fill="#2A2825">」AI</tspan>
  </text>

  <!-- 分隔短线 -->
  <line x1="540" y1="462" x2="660" y2="462" stroke="#DA7756" stroke-width="4"/>

  <!-- 副标题 -->
  <text x="600" y="528" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="30" fill="#7A776F" letter-spacing="1">变的不是技术</text>
  <text x="600" y="572" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="30" fill="#7A776F" letter-spacing="1">是组织的方式</text>

  <!-- 右下角署名 -->
  <text x="1140" y="738" text-anchor="end" font-family="PingFang SC, -apple-system, sans-serif" font-size="22" fill="#A8A49B">深度解读 · Claude Tag</text>
</svg>
</body>
</html>
