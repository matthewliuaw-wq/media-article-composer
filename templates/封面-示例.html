<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#F0EEE6; }
  .cover { width:2350px; height:1000px; background:#F0EEE6; }
</style>
</head>
<body>
<div class="cover">
<svg width="2350" height="1000" viewBox="0 0 2350 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="6" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,7 L0,14 L3,7 Z" fill="#2A2825"/>
    </marker>
  </defs>

  <!-- 顶部小标识 -->
  <circle cx="118" cy="118" r="9" fill="#DA7756"/>
  <text x="146" y="128" font-family="PingFang SC, -apple-system, sans-serif" font-size="30" fill="#7A776F" letter-spacing="2">AI · COWORKER</text>

  <!-- 主标题 -->
  <text x="1175" y="290" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="112" font-weight="700" fill="#2A2825" letter-spacing="2">从「我的 AI」到「我们的 AI」</text>

  <!-- 副标题 -->
  <text x="1175" y="378" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="46" fill="#7A776F" letter-spacing="1">Claude Tag 凭什么被叫 10x Claude Code</text>

  <!-- 副标题下的分隔短线 -->
  <line x1="1075" y1="418" x2="1275" y2="418" stroke="#DA7756" stroke-width="4"/>

  <!-- ===== 左：孤立单节点「我的 AI」 ===== -->
  <circle cx="440" cy="668" r="92" fill="#DA7756" opacity="0.13"/>
  <circle cx="440" cy="668" r="56" fill="#DA7756" stroke="#2A2825" stroke-width="6"/>
  <text x="440" y="812" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="36" fill="#7A776F">我的 AI</text>

  <!-- ===== 中：箭头 + 10x ===== -->
  <text x="812" y="620" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="58" font-weight="700" fill="#DA7756">10x</text>
  <line x1="560" y1="668" x2="1075" y2="668" stroke="#2A2825" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- ===== 右：互联节点网络「我们的 AI」 ===== -->
  <!-- 连线（先画，置于节点下） -->
  <g stroke="#DA7756" stroke-width="5" opacity="0.55">
    <line x1="1560" y1="668" x2="1390" y2="580"/>
    <line x1="1560" y1="668" x2="1540" y2="520"/>
    <line x1="1560" y1="668" x2="1720" y2="560"/>
    <line x1="1560" y1="668" x2="1780" y2="700"/>
    <line x1="1560" y1="668" x2="1660" y2="800"/>
    <line x1="1560" y1="668" x2="1470" y2="810"/>
    <line x1="1560" y1="668" x2="1340" y2="720"/>
    <line x1="1390" y1="580" x2="1540" y2="520"/>
    <line x1="1540" y1="520" x2="1720" y2="560"/>
    <line x1="1720" y1="560" x2="1780" y2="700"/>
    <line x1="1780" y1="700" x2="1660" y2="800"/>
    <line x1="1660" y1="800" x2="1470" y2="810"/>
    <line x1="1470" y1="810" x2="1340" y2="720"/>
    <line x1="1340" y1="720" x2="1390" y2="580"/>
  </g>
  <!-- 外围节点（镂空橙环） -->
  <g fill="#F0EEE6" stroke="#DA7756" stroke-width="5">
    <circle cx="1390" cy="580" r="40"/>
    <circle cx="1540" cy="520" r="40"/>
    <circle cx="1720" cy="560" r="40"/>
    <circle cx="1780" cy="700" r="40"/>
    <circle cx="1660" cy="800" r="40"/>
    <circle cx="1470" cy="810" r="40"/>
    <circle cx="1340" cy="720" r="40"/>
  </g>
  <!-- 中心节点（实心橙） -->
  <circle cx="1560" cy="668" r="50" fill="#DA7756" stroke="#2A2825" stroke-width="6"/>
  <text x="1560" y="912" text-anchor="middle" font-family="PingFang SC, -apple-system, sans-serif" font-size="36" fill="#7A776F">我们的 AI</text>

  <!-- 右下角小字署名 -->
  <text x="2232" y="958" text-anchor="end" font-family="PingFang SC, -apple-system, sans-serif" font-size="26" fill="#A8A49B">深度解读 · Claude Tag</text>
</svg>
</div>
</body>
</html>
